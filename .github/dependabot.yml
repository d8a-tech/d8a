version: 2

# Multi-ecosystem jobs drop security group rules (dependency-groups: []),
# producing individual security PRs. Keep explicit per-ecosystem groups until
# Dependabot supports security grouping alongside multi-ecosystem updates.
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      go-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
      security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "go"

  - package-ecosystem: "npm"
    directories:
      - "/docs"
      - "/js/ga4-duplicator"
      - "/js/web-tracker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps"
      include: "scope"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "typescript"
        versions:
          - ">=7.0.0"
    groups:
      javascript-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
      security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "javascript"
